syntax = "proto3";

package prototype;

option go_package = "go.chromium.org/chromiumos/infra/proto/go/prototype";

import "prototype/ref_design.proto";
import "prototype/src/overlays/config.proto";

message FirmwarePayload {
  string build_target = 1;
  string pinned_version = 2;
}

message FirmwareConfig {
  FirmwarePayload ap_ro = 1;
  FirmwarePayload ap_rw = 2;
  FirmwarePayload ec = 3;
}

message DeviceVariantConfig {
  DeviceVariantId id = 1;
  OverlayConfig overlay_config = 2;
  FirmwareConfig firmware_config = 3;
}

message BuildTargetId {
  string value = 1;
}

message BuildTargetConfig {
  BuildTargetId id = 1;
  repeated DeviceVariantConfig variant_config = 2;
}

message BuildTargetConfigList {
  repeated BuildTargetConfig value = 1;
}
