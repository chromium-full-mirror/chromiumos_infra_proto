syntax = "proto3";

package client;

import "client/client_id.proto";

option go_package = "go.chromium.org/chromiumos/infra/proto/go/client";

// Id of a client profile. See comment in client/client.proto for
// more details.
message ProfileId {
  // Required.
  string id = 1;

  // Required.
  client.ClientId client_id = 2;
}
