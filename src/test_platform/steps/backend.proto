syntax = "proto3";

package test_platform.steps;

import "test_platform/request.proto";
import "test_platform/steps/enumeration.proto";
import "test_platform/config/config.proto";

option go_package = "go.chromium.org/chromiumos/infra/proto/go/test_platform/steps";

// BackendRequest defines the input of the Backend step.
message BackendRequest {
    // Request is the full cros_test_platform request.
    //
    // TODO(akeshet): Don't expose the full request to the enumeration step,
    // pull out only the fields that it needs.
    test_platform.Request request = 1;

    EnumerationResponse enumeration = 2;

    test_platform.config.Config config = 3;
}

// BackendResponse defines the output of the test enumeration step.
message BackendResponse {
    // TODO(akeshet): Define me.
}
