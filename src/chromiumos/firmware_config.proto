// Schema for configuring firmware versions.

syntax = "proto3";

package chromiumos;

option go_package = "go.chromium.org/chromiumos/infra/proto/go/chromiumos";
option java_package = "com.google.chrome.crosinfra.proto";

// Config for signing of a specific model.
message ModelSigningConfig {
  // Key name to use.
  string key_id = 1; // e.g. "CROTA"

  // LOEM ID that will be used.
  string signature_id = 2; // e.g. "CROTAA"

  // Brand code for the model.
  string brand_code = 3; // e.g. "ZZCR"

  // Whether the signature ID is in the customization ID.
  bool signature_id_in_customization_id = 4; // e.g. false
}

// A sinfgle firmware version
message FirmwareVersion {
  // The URI at which the firmware binary can be found.
  string uri = 1;

  // SHA256 hash of the firmware binary.
  string sha256 = 2;
}

// Config for a specific firmware type.
message FirmwareConfig {
  // Read-only firmware version.
  FirmwareVersion ro_firmware = 1;

  // Read-write firmware version.
  FirmwareVersion rw_firmware = 2;
}

// This is the primary object to be used for configuring firmware for a model.
message FirmwareConfigForModel {
  // Name of the model in question.
  string model = 1; // e.g. "crota"

  // Signing config for the firmware of the model.
  ModelSigningConfig signing = 2;

  // AP Firmware config.
  FirmwareConfig ap_firmware = 3;

  // EC firmware config.
  FirmwareConfig ec_firmware = 4;
}
