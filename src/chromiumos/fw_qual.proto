syntax = "proto3";

package chromiumos;

import "google/protobuf/descriptor.proto";

option go_package = "go.chromium.org/chromiumos/infra/proto/go/chromiumos";
option java_package = "com.google.chrome.crosinfra.proto";

message Version {
  // Format: MMMMM.mmm.b
  string value = 1;
}

message DeviceInfo {
  string model_name = 1;
  string sku = 2;
}

// Config for qualifying of a specific model.
message ModelQualConfig {
  enum HardwareType {
    HARDWARE_TYPE_UNSPECIFIED = 0;
    EVT = 1;
    DVT = 2;
    PVT = 3;
    MP = 4;
  }

  enum FirmwareType {
    FIRMWARE_TYPE_UNSPECIFIED = 0;
    RO_RW = 1;
    RW = 2;
  }

  enum QualType {
    QUAL_TYPE_UNSPECIFIED = 0;
    AP = 1;
    EC = 2;
    AP_EC = 3;
  }

  // Qual ID
  int32 id = 1;

  // Qual Name
  string name = 2;

  // Board to be tested
  string board_name = 3;

  // Device to be tested
  repeated DeviceInfo devices = 4;

  // Branch to get firmware from
  string branch_name = 5;

  // Qual type from enumerated type AP, EC, AP_EC
  QualType qual_type = 6;

  // RO or RW Qual
  FirmwareType firmware_type = 7;

  // Phase in test
  HardwareType testing_hardware = 8;

  // Target milestone, to be used in test
  int32 target_milestone_number = 9;

  // Primary AP RO FW Test Version
  Version ap_ro_firmware_build_cros_qual_version = 10;

  // Primary AP RW FW Test Version
  Version ap_rw_firmware_build_cros_qual_version = 11;

  // All AP RO FW Versions to test for compatibility
  repeated Version ap_ro_firmware_build_cros_versions = 12;

  // Primary EC RO FW Test Version
  Version ec_ro_firmware_build_cros_qual_version = 13;

  // Primary EC RW FW Test Version
  Version ec_rw_firmware_build_cros_qual_version = 14;

  // All EC RO FW Versions to test for compatibility
  repeated Version ec_ro_firmware_build_cros_versions = 15;

  // GSC Version to test with
  Version gsc_version = 16;
}

message ModelQualConfigs {
  // Qual configs to be used
  repeated ModelQualConfig quals = 1;
}