syntax = "proto3";

package chromite.api;

import "chromite/api/build_api.proto";
import "chromiumos/common.proto";

option go_package = "go.chromium.org/chromiumos/infra/proto/go/chromite/api";

// RequestStatus defines the result.
enum RequestStatus {
  STATUS_UNKNOWN = 0;
  STATUS_PASS = 1;
  STATUS_FAIL = 2;
}

message CreatePreMPKeysRequest {
  // Docker image to use for signing operations.
  // Should already be pulled down on the host.
  // This consists of the name of the docker image, followed by the tag, i.e.
  // "signing:1234".
  // This should be set programatically at run time, not manually.
  string docker_image = 5;

  // Path to the local checkout of the chromiumos/platform/release-keys.
  string release_keys_checkout = 6;

  // If set, will use the DevPreMPKeys keyset and will run the CloudKMS exporter
  // in dry run mode (so nothing will actually be exported to CloudKMS)..
  bool dry_run = 7;

  // Build target to create the PreMP keyset for.
  chromiumos.BuildTarget build_target = 1;

  // The version of the PreMP keyset, e.g. 2 in "FooPreMpKeys-v2".
  // Should only be set if the PreMP keys need to be regenerated for some
  // reason, e.g. if the existing keyset is broken or missing features.
  // Usually adding a LOEM to the existing keyset is sufficient.
  // Defaults to 1 (note that the "-v1" suffix is dropped, it is implicit).
  int32 version = 2;

  // Whether to skip generating android keys.
  bool skip_android_keys = 3;

  // Whether to generate UEFI keys.
  bool uefi = 4;

  // Whether to add a new loem to an existing keyset.
  bool add_loem = 8;
}

message CreatePreMPKeysResponse { RequestStatus request_status = 2; }

message CreateAccessoryKeyRequest {
  // Build target to create the accessory keyset for.
  chromiumos.BuildTarget build_target = 1;

  // Accessory to create the keyset for.
  string accessory = 2;

  // If set, create PreMP keyset
  bool is_pre_mp = 3;

  // Docker image to use for signing operations.
  // Should already be pulled down on the host.
  // This consists of the name of the docker image, followed by the tag, i.e.
  // "signing:1234".
  // This should be set programmatically at run time, not manually.
  string docker_image = 4;

  // Path to the local checkout of the chromiumos/platform/release-keys.
  string release_keys_checkout = 5;

  // If set, no gcloud operations will actually be performed
  bool dry_run = 6;

  // If set, use chromeos-bot instead of chromeos-release-bot for
  // cloud operations
  bool is_staging = 7;

  // The version of the keyset, e.g. 2 in "FooPreMpKeys-v2".
  // Ignored if request is for PreMP keyset.
  int32 version = 8;
}

message CreateAccessoryKeyResponse { RequestStatus request_status = 1; }

message SignTi50PaosRequest {
  // Cloud KMS properties for the key to use:
  string project = 1;
  string location = 2;
  string keyring = 3;
  string key = 4;
  int32 version = 5;

  // Directory where input (unsigned) artifacts are placed.
  string archive_dir = 6;

  // Directory where signed artifacts should be placed.
  chromiumos.ResultPath result_path = 7;

  // File name to be signed.
  string filename = 8;

  // Docker image to use for signing operations.
  // Should already be pulled down on the host.
  // This consists of the name of the docker image, followed by the tag, i.e.
  // "signing:1234".
  // This should be set programmatically at run time, not manually.
  string docker_image = 9;

  // Directory to be mounted to /tmp in the docker container.
  // Needed to avoid filling up our small boot partition..
  string tmp_path = 10;
}

message SignTi50PaosResponse {}

message CreateCertRequest {
  // Docker image to use for signing operations.
  // Should already be pulled down on the host.
  // This consists of the name of the docker image, followed by the tag, i.e.
  // "signing:1234".
  // This should be set programmatically at run time, not manually.
  string docker_image = 1;

  // If set, will skip gcloud operations.
  bool dry_run = 2;

  // If set, use dev project for cloud operations.
  bool is_staging = 3;

  // Name of the keyring.
  string keyring = 4;

  // Name of the key to create a cert for.
  string key_name = 5;

  // Path where cert should be placed.
  string out_path = 6;

  // Path to the local checkout of keys.
  string release_keys_checkout = 7;

  // Directory where artifacts should be placed.
  chromiumos.ResultPath result_path = 8;
}

message CreateCertResponse {
  // Status of cert creation.
  RequestStatus request_status = 1;

  // Path to created cert.
  string cert_path = 2;
}

message SignViaOnlineHsmRequest {
  // Docker image to use for signing operations.
  // Should already be pulled down on the host.
  // This consists of the name of the docker image, followed by the tag, i.e.
  // "signing:1234".
  // This should be set programmatically at run time, not manually.
  string docker_image = 1;
}

message SignViaOnlineHsmResponse {}

message CreateKeysHsmRequest {
  // Docker image to use for signing operations.
  // Should already be pulled down on the host.
  // This consists of the name of the docker image, followed by the tag, i.e.
  // "signing:1234".
  // This should be set programmatically at run time, not manually.
  string docker_image = 1;

  // Path to the local checkout of the chromiumos/platform/release-keys.
  string release_keys_checkout = 2;

  optional bool dry_run = 3;

  string keyset_name = 4;

  optional bool exporter_dry_run = 5;
}

message CreateKeysHsmResponse { RequestStatus request_status = 1; }

// Request to execute keyset management operations.
message KeysetManagerRequest {
  // Docker image to use for signing operations.
  // Should already be pulled down on the host.
  // This consists of the name of the docker image, followed by the tag, i.e.
  // "signing:1234".
  // This should be set programmatically at run time, not manually.
  string docker_image = 1;

  // If set, will not make any mutations in Cloud KMS
  bool dry_run = 2;

  // Path to the local checkout of the chromiumos/platform/release-keys.
  string release_keys_checkout = 3;

  // The list of operations to perform *in order*.
  repeated KeysetOp operations = 4;

  // Buganizer ID to be associated with the request (for logging/future use).
  int64 bug = 5;
}

// A wrapper message for individual keyset operations.
message KeysetOp {
  oneof op {
    KernelBumpOp kernel_bump = 1;
    MiniOsRollbackBumpOp minios_rollback_bump = 2;
  }
}

// Operation to bump the kernel version of selected keys.
message KernelBumpOp {
  // The keyset to bump. Required if update_all is false.
  string keyset = 1;

  // If true, update all targets. Must be set if keyset is empty.
  bool update_all = 2;
}

// Operation to bump the MiniOS rollback version.
message MiniOsRollbackBumpOp {
  // Target keyset
  string keyset = 1;

  // The new version/rollback index to set in kernel_subkey.vbpubk.
  uint32 version = 2;
}

// Response containing the results of the keyset management run.
message KeysetManagerResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_SUCCESS = 1;
    STATUS_FAILED = 2;
  }
  Status status = 1;
  // Detailed results for each executed operation.
  repeated KeysetOpResult results = 2;
  // Overall error message if the execution failed before processing operations.
  string error_message = 3;
}
// Detailed result of a single keyset operation.
message KeysetOpResult {
  // Name of the operation (e.g., "KernelBump", "MiniOsRollbackBump").
  string op_name = 1;
  enum OpStatus {
    OP_STATUS_UNSPECIFIED = 0;
    OP_STATUS_SUCCESS = 1;
    OP_STATUS_FAILED = 2;
    OP_STATUS_SKIPPED = 3;
  }
  OpStatus status = 2;
  // List of files modified or created by this operation
  // relative to the release-keys repository root
  repeated string modified_files = 3;
  // Operation-specific error message if it failed.
  string error_message = 4;
}

// The signing service.
service SigningService {
  option (service_options) = {
    module : "signing",
    service_branched_execution : EXECUTE_TOT,
    service_chroot_assert : OUTSIDE,
  };

  // Create a PreMP keyset for the given board.
  // Example json:
  // {
  //   "board": "foo",
  //   "uefi": true,
  // }
  rpc CreatePreMPKeys(CreatePreMPKeysRequest)
      returns (CreatePreMPKeysResponse) {};

  // Create an accessory keyset for the given board and accessory.
  rpc CreateAccessoryKeys(CreateAccessoryKeyRequest)
      returns (CreateAccessoryKeyResponse) {};

  // Sign PAOs in a Ti50 tarball.
  rpc SignTi50Paos(SignTi50PaosRequest) returns (SignTi50PaosResponse) {};

  // Create cert for a given key.
  rpc CreateCert(CreateCertRequest) returns (CreateCertResponse) {};

  // Initiate a signing operation against the online HSM.
  rpc SignViaOnlineHsm(SignViaOnlineHsmRequest)
      returns (SignViaOnlineHsmResponse) {};

  // Request key creation from the online HSM.
  rpc CreateKeysHsm(CreateKeysHsmRequest) returns (CreateKeysHsmResponse) {};

  // Execute keyset management operations.
  rpc KeysetManager(KeysetManagerRequest) returns (KeysetManagerResponse) {};
}
