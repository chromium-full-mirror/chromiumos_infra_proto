syntax = "proto3";

package auto_qual;

import "google/protobuf/descriptor.proto";
import "auto_qual/test_effort.proto";
import "auto_qual/os_build_target.proto";

option go_package = "go.chromium.org/chromiumos/infra/proto/go/auto_qual";

// Defines how to generate Test Efforts from LUCI Firmware Builders.
message BuilderQualConfig {
  // The name of the firmware builder.
  // This can be a SQL like pattern.
  //
  // Examples:
  //   * firmware-android-15949.B
  //   * firmware-android-brya-%
  string builder_name = 1;

  // A list of hardware models to generate qualification requests for.
  // The builder must generate firmware for the models specified here.
  // If this list is empty, then no models will be qualified.
  repeated string models = 2;

  // DEPRECATED. Will be removed soon. Use os_build_targets instead.
  repeated ModelTestEffortConfig.OsType operating_systems = 3;

  // Name of the test plan. Maps to a local path within the auto qual
  // repo containing the TestPlan text proto.
  // e.g: avs/firmware which maps to test_plans/avs/firmware.txtpb
  string test_plan_name = 8;

  // Test Plan Type to use for the generated test efforts.
  // DEPRECATED FIELD: Replaced by `test_plan_name`
  ModelTestEffortConfig.TestPlan.TestPlanType test_plan_type = 4;

  // RO+RW or RW Test Effort.
  ModelTestEffortConfig.FirmwareType firmware_type = 5;

  // Test Effort type from enumerated type AP, EC, AP_EC
  ModelTestEffortConfig.TestEffortType test_effort_type = 6;

  // The operating systems to generate test efforts for.
  // If this list is empty, then no qualifications will be generated.
  repeated OSBuildTarget os_build_targets = 7;
}

message BuilderQualConfigs {
  // Builder Qual Configs.
  repeated BuilderQualConfig builder_qual_config = 1;
}
